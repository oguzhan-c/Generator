# Geliştirme servisleri. Uygulama Development'ta açılırken ihtiyaç duyduğu servisi bilgisayarda bulamazsa buradan
# yalnızca onu başlatır (appsettings.Development.json → DevServices). Elle de çalıştırılabilir:
#   docker compose up -d                          # veritabanı
#   docker compose --profile mail up -d           # mailpit (http://localhost:8025)
#   docker compose --profile all up -d            # hepsi
#   docker compose --profile app up -d --build    # uygulamanın kendisi de konteynerde (http://localhost:8080)
# Konteyner şifreleri yalnızca yerel geliştirme içindir; gerçek ortamda kullanılmaz.
name: canapptemplate

services:
  # Veritabanı: kullandığın sağlayıcının servisini aç (satır başındaki "# " işaretlerini kaldır) ve en alttaki
  # volumes'ta db-data'yı aç. Uygulama Development'ta açılırken bu servisi gerekirse kendisi başlatır.
  # Konteyner şifreleri yalnızca yerel geliştirme içindir (appsettings.Development.json'daki bağlantı dizesiyle aynı).
  # postgres:
  #   image: postgres:18-alpine
  #   ports: ["5432:5432"]
  #   environment:
  #     POSTGRES_DB: canapptemplate
  #     POSTGRES_USER: canapptemplate
  #     POSTGRES_PASSWORD: canapptemplate
  #   volumes: ["db-data:/var/lib/postgresql"]
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U canapptemplate"]
  #     interval: 5s
  #     retries: 10

  # sqlserver:
  #   image: mcr.microsoft.com/mssql/server:2025-latest
  #   ports: ["1433:1433"]
  #   environment:
  #     ACCEPT_EULA: "Y"
  #     MSSQL_SA_PASSWORD: CanAppTemplate_Dev_123
  #   volumes: ["db-data:/var/opt/mssql"]
  #   healthcheck:
  #     test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P CanAppTemplate_Dev_123 -Q 'SELECT 1' || exit 1"]
  #     interval: 10s
  #     retries: 10
  #     start_period: 20s

  # Uygulama: yalnızca "--profile app" ile. Gizli ayarlar (JWT anahtarı vb.) .env dosyasından okunur (git'e girmez):
  #   Security__Jwt__SigningKey=...
  #   Security__VerificationCodeKey=...
  app:
    profiles: [app]
    build: .
    ports: ["8080:8080"]
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DevServices__Enabled: "false"
      Database__StartupMode: Migrate
      # Veritabanı servisini açtıysan bağlantı dizesini ve bağımlılığı da aç:
      # ConnectionStrings__CanAppTemplate: Host=postgres;Port=5432;Database=canapptemplate;Username=canapptemplate;Password=canapptemplate
      # ConnectionStrings__CanAppTemplate: Server=sqlserver,1433;Database=CanAppTemplate;User Id=sa;Password=CanAppTemplate_Dev_123;TrustServerCertificate=True
    # depends_on:
    #   postgres: { condition: service_healthy }      # ya da sqlserver

  mailpit:
    profiles: [mail, all]
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
#if (Redis)

  redis:
    profiles: [cache, all]
    image: redis:8-alpine
    ports: ["6379:6379"]
#endif
#if (Search)

  elasticsearch:
    profiles: [search, all]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    ports: ["9200:9200"]
    environment:
      ES_SETTING_DISCOVERY_TYPE: single-node
      ES_SETTING_XPACK_SECURITY_ENABLED: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: ["es-data:/usr/share/elasticsearch/data"]
#endif
#if (EventBus)

  rabbitmq:
    profiles: [broker, all]
    image: rabbitmq:4-management
    ports: ["5672:5672", "15672:15672"]
#endif
#if (FileStorage)

  azurite:
    profiles: [storage, all]
    image: mcr.microsoft.com/azure-storage/azurite:3.34.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--disableProductStyleUrl"]
    ports: ["10000:10000"]

  # S3 uyumlu depo (yerel geliştirmede anahtar kontrolü yapılmaz). Uygulama http://localhost:9000 adresini kullanır.
  seaweedfs:
    profiles: [storage, all]
    image: chrislusf/seaweedfs:latest
    command: ["server", "-s3", "-dir=/data"]
    ports: ["9000:8333"]
    volumes: ["s3-data:/data"]
#endif
#if (OpenTelemetry)

  dashboard:
    profiles: [observability, all]
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    ports: ["18888:18888", "4317:18889"]
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
#endif

volumes:
  # db-data:
  app-data:
#if (Search)
  es-data:
#endif
#if (FileStorage)
  s3-data:
#endif
