# GitHub Actions. Asıl iş build/ci.sh'ta.
name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    tags: ["v*"]   # v0.2.0 etiketi: canfxgen ve şablon NuGet'e yayınlanır
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # NuGet Trusted Publishing: etiketli derlemede nuget.org'dan geçici (1 saatlik) yayın anahtarı

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Build, test ve şablon doğrulama
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'templates/**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: ./build/ci.sh restore
      - run: ./build/ci.sh build
      - run: ./build/ci.sh test
      - run: ./build/ci.sh pack
      # Şablondan üç çözüm üretilir, canfxgen ile CRUD eklenir ve derlenir (CanFx paketleri nuget.org'dan)
      - run: ./build/ci.sh templates

      # Yayın yalnızca v* etiketinde. Anahtar: nuget.org Trusted Publishing politikası (oguzhan-c / Generator / ci.yml).
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true   # politika yoksa: publish yedek secret'ı dener, o da yoksa açık hata verir
        uses: NuGet/login@v1
        with:
          user: oguzhan-c   # nuget.org kullanıcı adı (e-posta değil)

      - run: ./build/ci.sh publish   # etiket yoksa atlanır
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}

      - name: Paketler ve şablon logu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/packages
            templates.log
          if-no-files-found: ignore

  rider-plugin:
    name: Rider eklentisi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rider-plugin
    env:
      # secrets doğrudan "if" içinde kullanılamaz: token tanımlı mı bilgisi ortam değişkeniyle taşınır
      HAS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4   # Gradle ve Rider SDK önbelleği

      - name: Sürüm (Generator ile aynı)
        id: version
        working-directory: .
        run: echo "value=$(./build/ci.sh version)" >> "$GITHUB_OUTPUT"

      - run: ./gradlew buildPlugin -PpluginVersion=${{ steps.version.outputs.value }}

      # Yalnızca v* etiketinde ve token varsa. İlk sürüm plugins.jetbrains.com'dan elle yüklenir (token o zamana kadar yok).
      - name: JetBrains Marketplace'e yayın
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_MARKETPLACE_TOKEN == 'true'
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin -PpluginVersion=${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: rider-plugin
          path: rider-plugin/build/distributions/*.zip
          if-no-files-found: ignore
